<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPIC Controller Dashboard</title>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <!-- HEADER -->
  <header>
    <div>
      <h1>EPIC Controller Dashboard</h1>
      <div class="legend">
        <span class="lg"><span class="dot dot-green"></span>READY</span>
        <span class="lg"><span class="dot dot-red"></span>BLOCKED</span>
        <span class="lg"><span class="dot dot-gray"></span>UNKNOWN</span>
      </div>
    </div>

    <div class="search">
      <input id="ctrl-search" type="text" placeholder="Search controllers" autocomplete="off" />
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="main-layout">
    <!-- LEFT: Controller Grid -->
    <main id="grid" class="grid"></main>

    <!-- RIGHT: Sidebar -->
    <aside>
      <!-- Sensors Section -->
      <div class="section">
        <h3>SENSORS</h3>
        <table id="sensor-table">
          <thead>
            <tr>
              <th>Device ID</th>
              <th>Type</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Actuators Section -->
      <div class="section">
        <h3>ACTUATORS</h3>
        <table id="motor-table">
          <thead>
            <tr>
              <th>Motor ID</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Summary Section -->
      <div class="section">
        <h3>SUMMARY</h3>
        <table>
          <tbody>
            <tr>
              <td>Jetson Host</td>
              <td><span class="pill" id="sum-host">—</span></td>
            </tr>
            <tr>
              <td>Xsensors</td>
              <td><span class="pill" id="sum-xsens">—</span></td>
            </tr>
            <tr>
              <td>Wi-Fi</td>
              <td><span class="pill" id="sum-wifi">—</span></td>
            </tr>
            <tr>
              <td>Last updated</td>
              <td><span class="pill" id="sum-ts">—</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </aside>
  </div>

  <!-- TOAST ROOT (centered below header) -->
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>

  <!-- Confirm modal -->
  <div id="confirm" hidden>
    <div class="confirm-box">
      <h3 id="confirm-title" class="confirm-title">Run controller</h3>
      <p id="confirm-msg" class="confirm-msg">Run “…” on the Jetson now?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn">Cancel</button>
        <button id="confirm-ok" class="btn btn-run">Run</button>
      </div>
    </div>
  </div>

  <!-- External JavaScript -->
  <script defer src="./assets/app.js"></script>
</body>
</html>
